services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: gymflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - gymflow_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  gymflow_sql_data:
